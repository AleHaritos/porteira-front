<hlm-dialog-header>
  <div class="editar-animal__header-linha">
    <div class="editar-animal__icone">
      <ng-icon name="lucideSquarePen" size="20" />
    </div>
    <div>
      <h3 hlmDialogTitle>Editar Animal</h3>
      <p class="editar-animal__subtitulo">Atualize os dados do animal</p>
    </div>
  </div>
</hlm-dialog-header>

<div class="editar-animal__form">
  <div class="editar-animal__grid">
    <div class="editar-animal__campo">
      <label hlmLabel>Tipo</label>
      <hlm-select [value]="tipo()" (valueChange)="onTipoChange($event)" [itemToString]="itemToStringTipo">
        <hlm-select-trigger class="w-full">
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (opcao of context.tipoOptions; track opcao.value) {
          <hlm-select-item [value]="opcao.value">{{ opcao.label }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>

    <div class="editar-animal__campo">
      <label hlmLabel>Lote</label>
      <hlm-select [value]="loteId()" (valueChange)="onLoteChange($event)" [itemToString]="itemToStringLote">
        <hlm-select-trigger class="w-full">
          <hlm-select-value placeholder="Sem lote" />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          <hlm-select-item [value]="null">Sem lote</hlm-select-item>
          @for (lote of context.lotes; track lote.id) {
          <hlm-select-item [value]="lote.id">{{ lote.nome }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>

    <div class="editar-animal__campo">
      <label hlmLabel>Sexo</label>
      <hlm-select [value]="sexo()" (valueChange)="onSexoChange($event)" [itemToString]="itemToStringSexo">
        <hlm-select-trigger class="w-full">
          <hlm-select-value placeholder="Não informado" />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          <hlm-select-item [value]="null">Não informado</hlm-select-item>
          @for (opcao of sexoOptions; track opcao.value) {
          <hlm-select-item [value]="opcao.value">{{ opcao.label }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>

    <div class="editar-animal__campo">
      <label hlmLabel for="brinco">Brinco</label>
      <input hlmInput id="brinco" type="text" [value]="brinco()" (input)="onBrincoInput($event)" />
    </div>

    <div class="editar-animal__campo">
      <label hlmLabel for="raca">Raça</label>
      <input hlmInput id="raca" type="text" [value]="raca()" (input)="onRacaInput($event)" />
    </div>

    <div class="editar-animal__campo">
      <label hlmLabel for="peso">Peso (kg)</label>
      <input hlmInput id="peso" type="text" placeholder="0,0" [value]="pesoRaw()" (input)="onPesoInput($event)" />
    </div>

    <div class="editar-animal__campo">
      <label hlmLabel for="dataNascimento">Data de nascimento</label>
      <input hlmInput id="dataNascimento" type="date" [value]="dataNascimento() ?? ''" (input)="onDataNascimentoInput($event)" />
    </div>

    <div class="editar-animal__campo">
      <label hlmLabel for="dataCompra">Data de compra</label>
      <input hlmInput id="dataCompra" type="date" [value]="dataCompra() ?? ''" (input)="onDataCompraInput($event)" />
    </div>

    <div class="editar-animal__campo">
      <label hlmLabel for="valorCompra">Valor de compra</label>
      <input hlmInput id="valorCompra" type="text" placeholder="0,00" [value]="valorCompraRaw()" (input)="onValorCompraInput($event)" />
    </div>
  </div>

  <div class="editar-animal__campo">
    <label hlmLabel for="descricao">Descrição</label>
    <textarea hlmTextarea id="descricao" rows="2" [value]="descricao()" (input)="onDescricaoInput($event)"></textarea>
  </div>
</div>

<hlm-dialog-footer class="mt-2">
  <button hlmBtn variant="outline" type="button" class="cursor-pointer" [disabled]="salvando()" (click)="cancelar()">Cancelar</button>
  <button hlmBtn class="editar-animal__btn-salvar cursor-pointer" type="button" [disabled]="salvando()" (click)="salvar()">
    {{ salvando() ? 'Salvando...' : 'Salvar' }}
  </button>
</hlm-dialog-footer>

<hlm-dialog-header>
  <div class="novo-lote__header-linha">
    <div class="novo-lote__icone">
      <ng-icon name="lucidePawPrint" size="20" />
    </div>
    <div>
      <h3 hlmDialogTitle>{{ editando ? 'Editar Lote' : 'Novo Lote' }}</h3>
      <p class="novo-lote__subtitulo">Grupo de animais da fazenda</p>
    </div>
  </div>
</hlm-dialog-header>

<form [formGroup]="form" class="novo-lote__form">
  <div class="novo-lote__campo">
    <label hlmLabel for="nome">Nome</label>
    <input hlmInput id="nome" formControlName="nome" placeholder="Ex: Lote 1 - Pasto Norte" />
  </div>

  <div class="novo-lote__campo">
    <label hlmLabel for="observacoes">Observações</label>
    <textarea hlmTextarea id="observacoes" formControlName="observacoes" rows="3"></textarea>
  </div>
</form>

<hlm-dialog-footer class="mt-2">
  <button hlmBtn variant="outline" type="button" class="cursor-pointer" (click)="cancelar()">Cancelar</button>
  <button hlmBtn class="novo-lote__btn-salvar cursor-pointer" type="button" [disabled]="salvando()" (click)="salvar()">
    {{ salvando() ? 'Salvando...' : 'Salvar' }}
  </button>
</hlm-dialog-footer>

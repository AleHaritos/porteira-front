<div class="piquetes-tab__header">
  <button hlmBtn class="piquetes-tab__btn-novo cursor-pointer" (click)="abrirNovoPiquete()">
    <ng-icon name="lucidePlus" size="16" />
    Novo Piquete
  </button>
</div>

<div class="fazenda-table">
  <div hlmTableContainer>
    <table hlmTable>
      <thead hlmTHead>
        <tr hlmTr class="fazenda-table__head-row">
          <th hlmTh>Nome</th>
          <th hlmTh>Área (ha)</th>
          <th hlmTh>Animais</th>
          <th hlmTh class="w-[120px] text-right pr-7">Ações</th>
        </tr>
      </thead>

      <tbody hlmTBody>
        @for (piquete of piquetes(); track piquete.id) {
        <tr hlmTr class="fazenda-table__row">
          <td hlmTd class="fazenda-table__nome animais-table__nome-clicavel" (click)="abrirDetalhe(piquete)">{{ piquete.nome }}</td>
          <td hlmTd>{{ piquete.areaHectares }} ha</td>
          <td hlmTd>{{ piquete.quantidadeAnimais }}</td>
          <td hlmTd class="text-right">
            <div class="piquetes-tab__acoes">
              <button hlmBtn variant="ghost" size="icon"
                class="fazenda-table__action-btn fazenda-table__action-btn--editar cursor-pointer"
                (click)="abrirNovoPiquete(piquete, $event)" title="Editar">
                <ng-icon name="lucideSquarePen" size="16" />
              </button>
              <button hlmBtn variant="ghost" size="icon"
                class="fazenda-table__action-btn fazenda-table__action-btn--excluir cursor-pointer"
                (click)="inativar(piquete, $event)" title="Inativar">
                <ng-icon name="lucideTrash2" size="16" />
              </button>
            </div>
          </td>
        </tr>
        } @empty {
        <tr hlmTr>
          <td hlmTd [attr.colSpan]="4" class="fazenda-table__empty">
            @if (carregando()) {
            Carregando piquetes...
            } @else {
            Nenhum piquete cadastrado
            }
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>

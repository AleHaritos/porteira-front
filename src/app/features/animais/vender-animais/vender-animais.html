<hlm-dialog-header class="mb-2">
  <div class="vender-animais__header-linha">
    <div class="vender-animais__icone">
      <ng-icon name="lucideCoins" size="20" />
    </div>
    <div>
      <h3 hlmDialogTitle>Vender Animais</h3>
    </div>
  </div>
</hlm-dialog-header>

<div class="vender-animais__form">
  <ul class="vender-animais__lista">
    @for (animal of context.animais; track animal.id) {
    <li class="vender-animais__item">
      <span>{{ animal.tipo }}</span>
      <span class="vender-animais__item-brinco">Brinco: {{ animal.brinco || '-' }}</span>
      <span class="vender-animais__item-desc">{{ animal.descricao || '-' }}</span>
    </li>
    }
  </ul>

  <div class="vender-animais__campo">
    <label hlmLabel for="valor">Valor total da venda</label>
    <input hlmInput id="valor" type="text" placeholder="0,00" [value]="valorRaw()" (input)="onValorInput($event)" />
  </div>

  <div class="vender-animais__campo">
    <label hlmLabel for="data">Data da venda</label>
    <input hlmInput id="data" type="date" [value]="data()" (input)="onDataInput($event)" />
  </div>

  <div class="vender-animais__campo">
    <label hlmLabel for="descricao">Descrição (opcional)</label>
    <textarea hlmTextarea id="descricao" rows="2" [value]="descricao()" (input)="onDescricaoInput($event)"></textarea>
  </div>
</div>

<hlm-dialog-footer class="mt-2">
  <button hlmBtn variant="outline" type="button" class="cursor-pointer" [disabled]="salvando()" (click)="cancelar()">Cancelar</button>
  <button hlmBtn class="vender-animais__btn-confirmar cursor-pointer" type="button" [disabled]="salvando()" (click)="confirmar()">
    {{ salvando() ? 'Registrando...' : 'Confirmar Venda' }}
  </button>
</hlm-dialog-footer>

<hlm-dialog-header>
  <div class="novo-produto__title-row">
    <span class="novo-produto__icon-badge">
      <ng-icon name="lucidePackage" size="16" />
    </span>
    <h3 hlmDialogTitle>Novo produto</h3>
  </div>
  <p class="novo-produto__description">Preencha os dados para cadastrar um novo produto.</p>
</hlm-dialog-header>

<form [formGroup]="form" (ngSubmit)="salvar()" class="flex flex-col gap-4 py-2">
  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="nome">Nome</label>
    <input hlmInput id="nome" type="text" formControlName="nome" placeholder="Ex: Ureia" class="w-full novo-produto__input" />
  </div>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="custo">Custo unitário (R$)</label>
    <input hlmInput id="custo" type="number" step="0.01" formControlName="custo" placeholder="Ex: 120.00" class="w-full novo-produto__input" />
  </div>

  @if (erro()) {
    <p class="text-sm text-red-600">{{ erro() }}</p>
  }
</form>

<hlm-dialog-footer>
  <button hlmBtn variant="outline" type="button" (click)="cancelar()" class="cursor-pointer">Cancelar</button>
  <button hlmBtn type="submit" class="novo-produto__btn-salvar cursor-pointer" [disabled]="form.invalid || loading()" (click)="salvar()">
    {{ loading() ? 'Salvando...' : 'Salvar' }}
  </button>
</hlm-dialog-footer>

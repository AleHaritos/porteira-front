<hlm-dialog-header>
  <div class="nova-talhao__title-row">
    <span class="nova-talhao__icon-badge">
      <ng-icon name="lucideMapPin" size="16" />
    </span>
    <h3 hlmDialogTitle>Novo Talhão</h3>
  </div>
  <p class="nova-talhao__description">Preencha os dados para cadastrar um novo talhão.</p>
</hlm-dialog-header>

<form [formGroup]="form" (ngSubmit)="salvar()" class="flex flex-col gap-4 py-2">
  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="nome">Nome</label>
    <input hlmInput id="nome" type="text" formControlName="nome" placeholder="Ex: Talhão Norte" class="w-full nova-talhao__input" />
  </div>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="areaHectares">Área (ha)</label>
    <input hlmInput id="areaHectares" type="number" step="0.01" formControlName="areaHectares" placeholder="Ex: 25.5" class="w-full nova-talhao__input" />
  </div>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="localizacao">Localização</label>
    <input hlmInput id="localizacao" type="text" formControlName="localizacao" placeholder="Opcional" class="w-full nova-talhao__input" />
  </div>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="observacao">Observação</label>
    <textarea
      hlmTextarea
      id="observacao"
      formControlName="observacao"
      placeholder="Opcional"
      rows="3"
      class="w-full nova-talhao__input"
    ></textarea>
  </div>

  @if (erro()) {
    <p class="text-sm text-red-600">{{ erro() }}</p>
  }
</form>

<hlm-dialog-footer>
  <button hlmBtn variant="outline" type="button" (click)="cancelar()" class="cursor-pointer">Cancelar</button>
  <button hlmBtn type="submit" class="nova-talhao__btn-salvar cursor-pointer" [disabled]="form.invalid || loading()" (click)="salvar()">
    {{ loading() ? 'Salvando...' : 'Salvar' }}
  </button>
</hlm-dialog-footer>

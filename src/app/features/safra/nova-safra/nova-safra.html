<hlm-dialog-header>
    <div class="nova-safra__title-row">
        <span class="nova-safra__icon-badge">
            <ng-icon name="lucideWheat" size="16" />
        </span>
        <h3 hlmDialogTitle>Nova safra</h3>
    </div>
    <p class="nova-safra__description">Preencha os dados para cadastrar uma nova safra.</p>
</hlm-dialog-header>
<form [formGroup]="form" (ngSubmit)="salvar()" class="flex flex-col gap-4 py-2">
    <div class="flex flex-col gap-1.5">
        <label hlmLabel for="nome">Nome</label>
        <input hlmInput id="nome" type="text" formControlName="nome" placeholder="Ex: Soja Talhão Norte"
            class="w-full nova-safra__input" />
    </div>

    <div class="flex flex-col gap-1.5">
        <label hlmLabel for="cultura">Cultura</label>
        <input hlmInput id="cultura" type="text" formControlName="cultura" placeholder="Ex: Soja"
            class="w-full nova-safra__input" />
    </div>

<div class="nova-safra__row">
  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="anoAgricola">Ano agrícola</label>
    <input
      hlmInput
      id="anoAgricola"
      type="text"
      formControlName="anoAgricola"
      placeholder="2025 ou 2025/2026"
      class="w-full nova-safra__input"
    />
    @if (form.get('anoAgricola')?.touched && form.get('anoAgricola')?.hasError('anoAgricolaInvalido')) {
      <span class="nova-safra__erro-campo">Use o formato 2025 ou 2025/2026</span>
    }
  </div>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="areaTotal">Área (ha)</label>
    <input hlmInput id="areaTotal" type="number" step="0.01" formControlName="areaTotal" placeholder="Ex: 50.55" class="w-full nova-safra__input" />
  </div>
</div>

    <div class="flex flex-col gap-1.5">
        <label hlmLabel for="status">Status</label>
        <hlm-select [value]="form.value.status" (valueChange)="onStatusChange($event)" [itemToString]="itemToString"
            class="nova-safra__select">
            <hlm-select-trigger class="w-full">
                <hlm-select-value />
            </hlm-select-trigger>
            <hlm-select-content *hlmSelectPortal>
                @for (opcao of statusOptions; track opcao.value) {
                <hlm-select-item [value]="opcao.value">{{ opcao.label }}</hlm-select-item>
                }
            </hlm-select-content>
        </hlm-select>
    </div>

    <div class="flex flex-col gap-1.5">
        <label hlmLabel for="observacoes">Observações</label>
        <textarea hlmTextarea id="observacoes" formControlName="observacoes" placeholder="Opcional" rows="3"
            class="w-full nova-safra__input"></textarea>
    </div>

    @if (erro()) {
    <p class="text-sm text-red-600">{{ erro() }}</p>
    }
</form>

<hlm-dialog-footer>
    <button hlmBtn variant="outline" type="button" (click)="cancelar()"
        class="nova-safra__btn-cancelar cursor-pointer">Cancelar</button>
    <button hlmBtn type="submit" class="nova-safra__btn-salvar cursor-pointer" [disabled]="form.invalid || loading()"
        (click)="salvar()">
        {{ loading() ? 'Salvando...' : 'Salvar' }}
    </button>
</hlm-dialog-footer>

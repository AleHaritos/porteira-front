<hlm-dialog-header>
  <div class="novo-projeto__title-row">
    <span class="novo-projeto__icon-badge">
      <ng-icon name="lucideFolderKanban" size="16" />
    </span>
    <h3 hlmDialogTitle>{{ modoEdicao ? 'Editar projeto' : 'Novo projeto' }}</h3>
  </div>
  <p class="novo-projeto__description">
    {{ modoEdicao ? 'Atualize os dados do projeto.' : 'Preencha os dados para registrar um novo projeto.' }}
  </p>
</hlm-dialog-header>

<form [formGroup]="form" class="flex flex-col gap-4 py-2">
  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="nome">Nome</label>
    <input hlmInput id="nome" type="text" formControlName="nome" placeholder="Ex: Construção do curral"
      class="w-full novo-projeto__input" />
  </div>

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="descricao">Descrição</label>
    <input hlmInput id="descricao" type="text" formControlName="descricao" placeholder="Opcional"
      class="w-full novo-projeto__input" />
  </div>

  @if (modoEdicao) {
  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="status">Status</label>
    <hlm-select formControlName="status" [itemToString]="statusItemToString">
      <hlm-select-trigger buttonId="status" class="w-full">
        <hlm-select-value />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal>
        @for (opcao of statusOptions; track opcao.valor) {
        <hlm-select-item [value]="opcao.valor">{{ opcao.label }}</hlm-select-item>
        }
      </hlm-select-content>
    </hlm-select>
  </div>
  }

  <div class="flex flex-col gap-1.5">
    <label hlmLabel for="observacoes">Observações</label>
    <textarea hlmTextarea id="observacoes" formControlName="observacoes" placeholder="Opcional" rows="3"
      class="w-full novo-projeto__input"></textarea>
  </div>

  @if (erro()) {
  <p class="text-sm text-red-600">{{ erro() }}</p>
  }
</form>

<hlm-dialog-footer>
  <button hlmBtn variant="outline" type="button" class="cursor-pointer" (click)="cancelar()">Cancelar</button>
  <button hlmBtn type="button" class="novo-projeto__btn-salvar cursor-pointer" [disabled]="form.invalid || loading()"
    (click)="salvar()">
    {{ loading() ? 'Salvando...' : (modoEdicao ? 'Salvar alterações' : 'Salvar') }}
  </button>
</hlm-dialog-footer>

<div class="financeiro-page">
  <div class="financeiro-page__header">
    <h2 class="financeiro-page__titulo">Financeiro</h2>
  </div>

  <hlm-tabs [tab]="abaAtiva()" class="w-full">
    <hlm-tabs-list variant="line" class="financeiro-page__tabs-list">
      <button hlmTabsTrigger="financeiro" (click)="selecionarAba('financeiro')" class="cursor-pointer">
        Financeiro
      </button>
      <button hlmTabsTrigger="transacoes" (click)="selecionarAba('transacoes')" class="cursor-pointer">
        Transações
      </button>
      <button hlmTabsTrigger="pendentes" (click)="selecionarAba('pendentes')" class="cursor-pointer">
        Contas Pendentes
      </button>
    </hlm-tabs-list>

    <div hlmTabsContent="financeiro" class="financeiro-page__content">
      @if (abaAtiva() === 'financeiro' && fazendaId() != null) {
        <app-financeiro-resumo-tab [fazendaId]="fazendaId()!" (abrirContasPendentes)="selecionarAba('pendentes')" />
      }
    </div>

    <div hlmTabsContent="transacoes" class="financeiro-page__content">
      @if (abaAtiva() === 'transacoes' && fazendaId() != null) {
        <app-transacoes-tab [fazendaId]="fazendaId()!" />
      }
    </div>

    <div hlmTabsContent="pendentes" class="financeiro-page__content">
      @if (abaAtiva() === 'pendentes') {
        <app-contas-pendentes />
      }
    </div>
  </hlm-tabs>
</div>

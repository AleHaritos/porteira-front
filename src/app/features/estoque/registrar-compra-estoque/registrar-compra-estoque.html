<hlm-dialog-header>
  <div class="registrar-compra__header-linha">
    <div class="registrar-compra__icone">
      <ng-icon name="lucideShoppingCart" size="20" />
    </div>
    <div>
      <h3 hlmDialogTitle>Registrar Compra</h3>
      <p hlmDialogDescription>{{ context.produto.nome }}</p>
    </div>
  </div>
</hlm-dialog-header>

<form [formGroup]="form" class="registrar-compra__form mt-2" (ngSubmit)="salvar()">
  <div class="registrar-compra__linha">
    <div class="registrar-compra__campo">
      <label hlmLabel>Quantidade</label>
      <input hlmInput type="text" inputmode="numeric" [value]="formatarInputDisplay(quantidadeRaw())"
        (input)="onQuantidadeInput($any($event.target).value)" placeholder="0,00" />
    </div>

    <div class="registrar-compra__campo">
      <label hlmLabel>Valor Un</label>
      <input hlmInput type="text" inputmode="numeric" [value]="formatarInputDisplay(valorUnitarioRaw())"
        (input)="onValorUnitarioInput($any($event.target).value)" placeholder="0,00" />
    </div>
  </div>

  <div class="registrar-compra__campo">
    <label hlmLabel>Data</label>
    <hlm-date-picker formControlName="data" [maxDate]="maxDate" class="w-full">
      <hlm-date-picker-trigger buttonId="dataCompra" class="w-full">Selecionar data</hlm-date-picker-trigger>
    </hlm-date-picker>
  </div>

  <div class="registrar-compra__campo">
    <label hlmLabel>Observação (opcional)</label>
    <input hlmInput formControlName="observacao" placeholder="Ex: Fornecedor X" />
  </div>

  <div class="registrar-compra__acoes">
    <button type="button" hlmBtn variant="outline" (click)="cancelar()">Cancelar</button>
    <button type="submit" hlmBtn class="registrar-compra__btn-salvar cursor-pointer" [disabled]="salvando()">
      {{ salvando() ? 'Salvando...' : 'Registrar' }}
    </button>
  </div>
</form>

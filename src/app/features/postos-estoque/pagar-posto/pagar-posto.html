<hlm-dialog-header>
  <div class="pagar-posto__header-linha">
    <div class="pagar-posto__header-icone">
      <ng-icon name="lucideHandCoins" size="20" />
    </div>
    <div class="pagar-posto__header-textos">
      <h3 hlmDialogTitle>Pagar Posto</h3>
      <p hlmDialogDescription class="pagar-posto__header-subtitulo">
        {{ posto.nome }} · Saldo devedor: {{ formatarValor(posto.saldoDevedor) }}
      </p>
    </div>
  </div>
</hlm-dialog-header>

<form [formGroup]="form" class="pagar-posto__form">
  <div class="pagar-posto__linha">
    <div class="pagar-posto__campo">
      <label hlmLabel for="valor">Valor do Pagamento</label>
      <input hlmInput type="text" inputmode="numeric" id="valor"
        [value]="formatarValorDisplay(valorRaw())" (input)="onValorInput($any($event.target).value)" placeholder="0,00" />
    </div>

    <div class="pagar-posto__campo">
      <label hlmLabel>Data</label>
      <hlm-date-picker formControlName="data" [maxDate]="maxDate" class="w-full">
        <hlm-date-picker-trigger buttonId="data" class="w-full">Selecionar data</hlm-date-picker-trigger>
      </hlm-date-picker>
    </div>
  </div>

  <div class="pagar-posto__vinculo-toggle">
    <button type="button" hlmBtn variant="outline" class="pagar-posto__toggle-btn cursor-pointer"
      [class.pagar-posto__toggle-btn--ativo]="vinculo() === 'NEGOCIO'" (click)="onVinculoChange('NEGOCIO')">
      Negócio
    </button>
    <button type="button" hlmBtn variant="outline" class="pagar-posto__toggle-btn cursor-pointer"
      [class.pagar-posto__toggle-btn--ativo]="vinculo() === 'SAFRA'" (click)="onVinculoChange('SAFRA')">
      Safra
    </button>
  </div>

  @if (vinculo() === 'NEGOCIO') {
    <div class="pagar-posto__campo">
      <label hlmLabel>Negócio</label>
      <hlm-select [value]="negocioSelecionado()" (valueChange)="onNegocioChange($event)"
        [itemToString]="itemToStringNegocio" class="w-full">
        <hlm-select-trigger class="w-full"><hlm-select-value /></hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (negocio of negocios(); track negocio.id) {
            <hlm-select-item [value]="negocio.id">{{ negocio.nome }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>
  } @else {
    <div class="pagar-posto__campo">
      <label hlmLabel>Safra</label>
      <hlm-select [value]="safraSelecionada()" (valueChange)="onSafraChange($event)"
        [itemToString]="itemToStringSafra" class="w-full">
        <hlm-select-trigger class="w-full"><hlm-select-value /></hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (safra of safras(); track safra.id) {
            <hlm-select-item [value]="safra.id">{{ safra.nome }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>
  }

  <div class="pagar-posto__campo">
    <label hlmLabel for="observacao">Observação</label>
    <textarea hlmTextarea id="observacao" formControlName="observacao" rows="2"></textarea>
  </div>
</form>

<hlm-dialog-footer>
  <button hlmBtn variant="outline" type="button" class="cursor-pointer" (click)="cancelar()">Cancelar</button>
  <button hlmBtn class="pagar-posto__btn-salvar cursor-pointer" type="button" [disabled]="salvando()" (click)="salvar()">
    {{ salvando() ? 'Salvando...' : 'Pagar' }}
  </button>
</hlm-dialog-footer>

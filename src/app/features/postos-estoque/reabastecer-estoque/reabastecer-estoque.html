<hlm-dialog-header>
  <div class="reabastecer-estoque__header-linha">
    <div class="reabastecer-estoque__header-icone">
      <ng-icon name="lucideFuel" size="20" />
    </div>
    <div class="reabastecer-estoque__header-textos">
      <h3 hlmDialogTitle>Reabastecer Estoque</h3>
      <p hlmDialogDescription class="reabastecer-estoque__header-subtitulo">
        Registra a compra de combustível pra o estoque da fazenda.
      </p>
    </div>
  </div>
</hlm-dialog-header>

<form [formGroup]="form" class="reabastecer-estoque__form">
  <div class="reabastecer-estoque__linha">
    <div class="reabastecer-estoque__campo">
      <label hlmLabel>Combustível</label>
      <hlm-select [value]="tipoCombustivel()" (valueChange)="onTipoCombustivelChange($event)"
        [itemToString]="itemToStringTipoCombustivel" class="w-full">
        <hlm-select-trigger class="w-full"><hlm-select-value /></hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (opcao of tipoCombustivelOptions; track opcao.value) {
            <hlm-select-item [value]="opcao.value">{{ opcao.label }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>

    <div class="reabastecer-estoque__campo">
      <label hlmLabel for="litros">Litros</label>
      <input hlmInput type="text" inputmode="decimal" id="litros"
        [value]="litrosRaw() ?? ''" (input)="onLitrosInput($any($event.target).value)" placeholder="0,000" />
    </div>
  </div>

  <div class="reabastecer-estoque__linha">
    <div class="reabastecer-estoque__campo">
      <label hlmLabel for="valorPorLitro">Valor por Litro</label>
      <input hlmInput type="text" inputmode="numeric" id="valorPorLitro"
        [value]="formatarValorPorLitroDisplay(valorPorLitroRaw())"
        (input)="onValorPorLitroInput($any($event.target).value)" placeholder="0,000" />
    </div>

    <div class="reabastecer-estoque__campo">
      <label hlmLabel>Data</label>
      <hlm-date-picker formControlName="data" [maxDate]="maxDate" class="w-full">
        <hlm-date-picker-trigger buttonId="data" class="w-full">Selecionar data</hlm-date-picker-trigger>
      </hlm-date-picker>
    </div>
  </div>

  <div class="reabastecer-estoque__campo">
    <label hlmLabel for="observacao">Observação</label>
    <textarea hlmTextarea id="observacao" formControlName="observacao" rows="2"></textarea>
  </div>
</form>

<hlm-dialog-footer>
  <button hlmBtn variant="outline" type="button" class="cursor-pointer" (click)="cancelar()">Cancelar</button>
  <button hlmBtn class="reabastecer-estoque__btn-salvar cursor-pointer" type="button" [disabled]="salvando()" (click)="salvar()">
    {{ salvando() ? 'Salvando...' : 'Salvar' }}
  </button>
</hlm-dialog-footer>

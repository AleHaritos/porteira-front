<div hlmSidebarWrapper class="fazenda-home">
  <hlm-sidebar collapsible="icon">
    <div hlmSidebarHeader>
      <div class="fazenda-home__header">
        <span class="fazenda-home__header-icon">🌾</span>
        @if (sidebarService.state() === 'expanded') {
        <span class="fazenda-home__sidebar-nome">
          {{ fazenda()?.nome ?? 'Carregando...' }}
        </span>
        }
      </div>
    </div>

    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <div hlmSidebarGroupLabel>Menu</div>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="negocios" routerLinkActive #rlaNegocios="routerLinkActive"
                [isActive]="rlaNegocios.isActive">
                <ng-icon name="lucideBriefcase" />
                <span>Meus Negócios</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="financeiro" routerLinkActive #rlaFinanceiro="routerLinkActive"
                [isActive]="rlaFinanceiro.isActive">
                <ng-icon name="lucideWallet" />
                <span>Financeiro</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="veiculo" routerLinkActive #rlaVeiculo="routerLinkActive"
                [isActive]="rlaVeiculo.isActive">
                <ng-icon name="lucideCar" />
                <span>Veículos</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="equipamento" routerLinkActive #rlaEquipamento="routerLinkActive"
                [isActive]="rlaEquipamento.isActive">
                <ng-icon name="lucideCog" />
                <span>Equipamento</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="manutencao" routerLinkActive #rlaManutencao="routerLinkActive"
                [isActive]="rlaManutencao.isActive">
                <ng-icon name="lucideWrench" />
                <span>Manutencao</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="fornecedores" routerLinkActive #rlaFornecedores="routerLinkActive"
                [isActive]="rlaFornecedores.isActive">
                <ng-icon name="lucideHandshake" />
                <span>Fornecedores</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="abastecimento" routerLinkActive #rlaAbastecimento="routerLinkActive"
                [isActive]="rlaAbastecimento.isActive">
                <ng-icon name="lucideGauge" />
                <span>Abastecimento</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="posto" routerLinkActive #rlaPosto="routerLinkActive"
                [isActive]="rlaPosto.isActive">
                <ng-icon name="lucideFuel" />
                <span>Posto/Estoque</span>
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton routerLink="safra" routerLinkActive #rlaSafra="routerLinkActive"
                [isActive]="rlaSafra.isActive">
                <ng-icon name="lucideWheat" />
                <span>Safra</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </hlm-sidebar>

  <main hlmSidebarInset>
    <div class="fazenda-home__topbar">
      <button class="fazenda-home__trigger" (click)="sidebarService.toggleSidebar()">
        <ng-icon name="lucidePanelLeft" />
        @if (sidebarService.state() === 'expanded') {
        <span>Menu</span>
        }
      </button>
      <button class="fazenda-home__voltar" (click)="voltar()">
        <ng-icon name="lucideArrowLeft" size="16" />
        Voltar
      </button>
    </div>
    <div class="fazenda-home__content">
      <router-outlet />
    </div>
  </main>
</div>

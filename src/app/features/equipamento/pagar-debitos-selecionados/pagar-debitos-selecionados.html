<hlm-dialog-header>
  <div class="pagar-debitos-selecionados__header-linha">
    <div class="pagar-debitos-selecionados__icone">
      <ng-icon hlm name="lucideHandCoins" size="20" />
    </div>
    <div>
      <h3 hlmDialogTitle>Pagar Débitos Selecionados</h3>
      <p hlmDialogDescription>{{ context.debitos.length }} débito(s) — Total {{ formatarValor(totalValor()) }}</p>
    </div>
  </div>
</hlm-dialog-header>

<form [formGroup]="form" class="pagar-debitos-selecionados__form mt-2" (ngSubmit)="salvar()">
  <div class="pagar-debitos-selecionados__lista">
    @for (debito of context.debitos; track debito.origem + '-' + debito.id) {
    <div class="pagar-debitos-selecionados__item">
      <span class="pagar-debitos-selecionados__item-nome">{{ nomeExibicao(debito) }}</span>
      <span class="pagar-debitos-selecionados__item-valor">{{ formatarValor(debito.valor) }}</span>
    </div>
    }
  </div>

  <div class="pagar-debitos-selecionados__campo">
    <label hlmLabel>Data</label>
    <hlm-date-picker formControlName="data" [maxDate]="maxDate" class="w-full">
      <hlm-date-picker-trigger buttonId="data" class="w-full">Selecionar data</hlm-date-picker-trigger>
    </hlm-date-picker>
  </div>

  <div class="pagar-debitos-selecionados__acoes">
    <button type="button" hlmBtn variant="outline" (click)="cancelar()">Cancelar</button>
    <button type="submit" hlmBtn class="pagar-debitos-selecionados__btn-salvar cursor-pointer" [disabled]="salvando()">
      {{ salvando() ? 'Salvando...' : 'Confirmar Pagamento (' + context.debitos.length + ')' }}
    </button>
  </div>
</form>

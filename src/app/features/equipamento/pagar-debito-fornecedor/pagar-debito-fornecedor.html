<hlm-dialog-header>
  <div class="pagar-debito-fornecedor__header-linha">
    <div class="pagar-debito-fornecedor__icone">
      <ng-icon hlm name="lucideHandCoins" size="20" />
    </div>
    <div>
      <h3 hlmDialogTitle>Pagar Débito</h3>
      <p hlmDialogDescription>{{ context.nomeAtivo }} — {{ formatarValor(context.valor) }}</p>
    </div>
  </div>
</hlm-dialog-header>

<form [formGroup]="form" class="pagar-debito-fornecedor__form mt-2" (ngSubmit)="salvar()">
  <div class="pagar-debito-fornecedor__campo">
    <label hlmLabel>Data</label>
    <hlm-date-picker formControlName="data" [maxDate]="maxDate" class="w-full">
      <hlm-date-picker-trigger buttonId="data" class="w-full">Selecionar data</hlm-date-picker-trigger>
    </hlm-date-picker>
  </div>

  <div class="pagar-debito-fornecedor__secao">
    <label hlmLabel>Vínculo</label>
    <div class="pagar-debito-fornecedor__toggle">
      <button type="button" [class.ativo]="vinculo() === 'NEGOCIO'" (click)="onVinculoChange('NEGOCIO')">
        Negócio
      </button>
      <button type="button" [class.ativo]="vinculo() === 'SAFRA'" (click)="onVinculoChange('SAFRA')">
        Safra
      </button>
    </div>
  </div>

  @if (vinculo() === 'NEGOCIO') {
  <div class="pagar-debito-fornecedor__campo">
    <label hlmLabel for="negocio">Negócio</label>
    <hlm-select [value]="negocioSelecionado()" (valueChange)="onNegocioChange($event)"
      [itemToString]="itemToStringNegocio" class="w-full">
      <hlm-select-trigger class="w-full">
        <hlm-select-value />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal>
        @for (negocio of negocios(); track negocio.id) {
        <hlm-select-item [value]="negocio.id">{{ negocio.nome }}</hlm-select-item>
        }
      </hlm-select-content>
    </hlm-select>
  </div>
  } @else {
  <div class="pagar-debito-fornecedor__campo">
    <label hlmLabel for="safra">Safra</label>
    <hlm-select [value]="safraSelecionada()" (valueChange)="onSafraChange($event)"
      [itemToString]="itemToStringSafra" class="w-full">
      <hlm-select-trigger class="w-full">
        <hlm-select-value />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal>
        @for (safra of safras(); track safra.id) {
        <hlm-select-item [value]="safra.id">{{ safra.nome }}</hlm-select-item>
        }
      </hlm-select-content>
    </hlm-select>
  </div>
  }

  <div class="pagar-debito-fornecedor__acoes">
    <button type="button" hlmBtn variant="outline" (click)="cancelar()">Cancelar</button>
    <button type="submit" hlmBtn class="pagar-debito-fornecedor__btn-salvar cursor-pointer" [disabled]="salvando()">
      {{ salvando() ? 'Salvando...' : 'Confirmar Pagamento' }}
    </button>
  </div>
</form>
